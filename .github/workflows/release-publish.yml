name: Release publish

# Step 2 of a release. Runs after Build succeeds on main. If the commit changed
# the package version (i.e. a release PR from `release-pr.yml` was merged), it
# publishes all packages to npm, tags the commit `v<version>` and creates a
# GitHub release.
#
# Every step is safe to re-run: Nx skips versions that are already on npm, and
# the tag/release step is skipped when the tag already exists.
#
# npm authenticates with trusted publishing (OIDC), so there is no npm token.
# Each package must have this workflow file (`release-publish.yml`) registered
# as a trusted publisher on npmjs.com, with "Allow npm dist-tag" turned on.

on:
  workflow_run:
    workflows: ['Build']
    types: [completed]
    branches: [main]

permissions:
  contents: write # push the tag and create the GitHub release
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # tags and history for the release notes

      - name: Check whether this commit is a release
        id: check
        run: |
          VERSION=$(node -p "require('./@kv-designsystem/react/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! git diff HEAD^ HEAD -- @kv-designsystem/react/package.json | grep -q '"version"'; then
            echo "Version unchanged in this commit, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists, already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup
        if: steps.check.outputs.release == 'true'

      - name: Build packages
        if: steps.check.outputs.release == 'true'
        run: pnpm nx run-many -t build -p @kv-designsystem/theme @kv-designsystem/css @kv-designsystem/react

      # While every version is a prerelease, `latest` gets the newest alpha. npm
      # refuses to publish a prerelease without an explicit tag, hence `--tag latest`.
      - name: Publish to npm
        if: steps.check.outputs.release == 'true'
        run: pnpm nx release publish --tag latest

      # Keep `alpha` pointing at the same version as `latest` for consumers who
      # install with `@alpha`. Requires "Allow npm dist-tag" in each package's
      # trusted publishing settings (pnpm >= 12.12.1 authenticates with OIDC).
      - name: Move the alpha dist-tag
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          for pkg in theme css react; do
            pnpm dist-tag add "@kv-designsystem/$pkg@$VERSION" alpha
          done

      - name: Tag and create GitHub release
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The checkout is a detached HEAD, so push only the new tag, not a branch.
          pnpm nx release changelog "$VERSION" \
            --git-commit=false --git-tag --git-push --git-push-args "refs/tags/v$VERSION"
